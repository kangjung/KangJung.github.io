<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263f36">
  <meta name="description" content="Spin Harvest의 4개 밭, 61개 3D 농장 퍼즐. 미로를 돌려 과일을 수확해 보세요.">
  <title>Spin Harvest · 게임하기</title>
  <link rel="canonical" href="https://kangjung.github.io/game/SpinHarvest/">

  <link rel="stylesheet" href="player.css?v=20261122-2">
  <script src="player.js?v=bumper-20261122" defer></script>
</head>
<body>
  <aside id="harvest-ad" aria-label="광고">
    <span class="ad-label">광고</span>
    <div class="ad-slot"><ins class="adsbygoogle" style="display:inline-block;width:300px;height:50px" data-ad-client="ca-pub-2007216448786117" data-ad-slot="8678539906" data-full-width-responsive="false"></ins></div>
  </aside>
  <main id="game" aria-label="Spin Harvest">
    <canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="농장 퍼즐. 화면의 좌우 버튼을 누르거나 좌우로 드래그하세요. 키보드 A와 D도 사용할 수 있습니다."></canvas>
    <section id="loading" class="overlay" role="status" aria-live="polite">
      <img src="favicon.png" width="64" height="64" alt="">
      <h1>농장으로 가는 중…</h1>
      <progress id="progress" max="1" value="0" aria-label="게임 불러오기"></progress>
      <p id="load-text">처음에는 조금 기다려 주세요.</p>
    </section>
    <section id="error" class="overlay" role="alert" hidden>
      <h1>농장을 불러오지 못했어요</h1>
      <p>연결을 확인하고 다시 시도해 주세요.<br>계속되지 않으면 다른 최신 브라우저로 열어 주세요.</p>
      <button id="retry" type="button">다시 불러오기</button>
      <a href="/games/spin-harvest/">게임 소개로 돌아가기</a>
    </section>
    <noscript>게임을 실행하려면 JavaScript가 필요합니다. <a href="/games/spin-harvest/">게임 소개</a></noscript>
  </main>
